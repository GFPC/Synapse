version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse_pass}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 5

  synapse-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse_pass}@postgres:5432/${POSTGRES_DB:-synapse}?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - JWT_SECRET=${JWT_SECRET:-supersecret}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
