name: Synapse CI (Test & Lint & Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend (Go) ────────────────────────────────────────────────────────
  backend-test:
    name: Backend (Go Test & Bench)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/api/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Verify Go Module Tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Coverage & Race Detection
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./pkg/... ./config/... ./internal/...

      - name: Run Micro-Benchmarks
        run: |
          go test -bench=. -benchmem ./pkg/... ./internal/...

      - name: Build Linux Binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/synapse-api ./cmd/api

  # ── 2. Frontend (React + TypeScript) ────────────────────────────────────────
  frontend-test:
    name: Frontend (TypeCheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: Run Linter
        run: npm run lint

      - name: Build Production SPA
        run: npm run build

  # ── 3. Docker Build Validation ──────────────────────────────────────────────
  docker-validation:
    name: Docker Images Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image (Dry-Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          tags: synapse-api:test

      - name: Build Web Docker Image (Dry-Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          tags: synapse-web:test
